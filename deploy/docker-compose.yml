# B & A Essentials on one server (Hostinger KVM 2, Ubuntu 24.04). Guide: docs/HOSTINGER.md
#
#   Internet -> Cloudflare (WAF, DDoS) -> Caddy (this server, ports 80/443, Cloudflare IPs only)
#            -> web (Gunicorn + Django, 127.0.0.1:8000) -> db (PostgreSQL), redis, clamav
#
# Only Caddy is reachable from outside. PostgreSQL, Redis and ClamAV have no ports on the
# server at all: they are on the private "backend" network that only the app can reach.
# Settings and passwords come from deploy/.env (never committed; see deploy/env.example).

name: banda

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: banda-web:latest
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.production
    # The app's own database user can read and write rows, nothing more (deploy/postgres-init).
    DATABASE_URL: postgres://banda_app:${BANDA_APP_PASSWORD:?}@db:5432/banda
    RESTORE_CHECK_DATABASE_URL: postgres://banda_app:${BANDA_APP_PASSWORD:?}@db:5432/banda_restore_check
    CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
    CACHE_LOCATION: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    FILE_SCAN_BACKEND: clamdscan
    CLAMD_HOST: clamav
    CLAMD_PORT: "3310"
    # docker/entrypoint.sh writes this file at start-up. Naming it here too means scheduled
    # jobs (`docker compose exec`, which skips the entrypoint) scan files as well.
    CLAMD_CONFIG_FILE: /tmp/clamd.conf
    # Cloudflare overwrites this header and the firewall only lets Cloudflare in.
    CLIENT_IP_HEADER: HTTP_CF_CONNECTING_IP
    SECURE_SSL_REDIRECT: "true"
    SECURE_COOKIE: "true"
    SECURE_HSTS_SECONDS: "31536000"
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - appdata:/app/var
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks: [backend]
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    <<: *app
    restart: unless-stopped
    # Reachable only from this server (Caddy), never from the internet.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'Host': host}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-off: `docker compose run --rm migrate`. Uses the owner account, which may change tables.
  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://banda_owner:${BANDA_OWNER_PASSWORD:?}@db:5432/banda
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine  # the same major version as CI and as pg_dump in the app image
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BANDA_OWNER_PASSWORD: ${BANDA_OWNER_PASSWORD:?}
      BANDA_APP_PASSWORD: ${BANDA_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banda"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Only rate-limit counters and the cache: nothing to keep across restarts.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    networks: [backend]
    logging: *logging

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamdb:/var/lib/clamav
    networks: [backend]
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # On the server's own network, so the firewall (ufw) decides who may connect to 80/443.
    # Docker's published ports would bypass ufw.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on: [web]
    logging: *logging

networks:
  backend:
    internal: false  # the app must reach Paystack, Termii, Resend and R2; nothing comes in

volumes:
  pgdata:
  appdata:
  clamdb:
  caddy_data:
  caddy_config:
