{% if messages %}
  <div class="space-y-2" role="status" aria-live="polite">
    {% for message in messages %}
      <div class="{% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %}">
        <span class="mt-0.5 h-2 w-2 shrink-0 rounded-full bg-current opacity-70"></span>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
