{% extends "banda/auth/base.html" %}
{% block title %}Verify your email{% endblock %}
{% block form %}
        <h2 class="font-display text-[34px] font-semibold leading-tight tracking-[-0.02em] sm:text-[38px]"> Check your email</h2>
        <p class="sub mt-1.5 text-[16.5px] text-ink-muted">We sent a 6-digit code to <strong class="text-ink">{{ email }}</strong>.</p>
        <form method="post" class="mt-9" novalidate>
          {% csrf_token %}
          <label for="code" class="gap mt-5 block text-[14px] font-semibold">Your code</label>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required aria-describedby="codeError" {% if form.code.errors or form.non_field_errors %}aria-invalid="true"{% endif %} class="mt-2 w-full rounded-xl border border-cream-line bg-white px-4 py-3.5 text-center font-display text-[24px] font-semibold tracking-[.4em] text-ink transition focus:border-brand-navy focus:outline-none focus:ring-4 focus:ring-brand-navy/10 aria-[invalid=true]:border-red-600" />
          <div id="codeError">{{ form.code.errors }}{{ form.non_field_errors }}</div>
          <button type="submit" class="submit group mt-7 flex w-full items-center justify-center gap-2.5 rounded-xl bg-brand-cta py-4 text-[15.5px] font-semibold text-white shadow-lg shadow-brand-orange/25 transition hover:bg-brand-ctaDark focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-orange focus-visible:ring-offset-2">Verify email <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-arrow-right h-[18px] w-[18px] transition-transform group-hover:translate-x-0.5"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
        </form>
        <form method="post" action="{% url 'verify-resend' %}" class="mt-4 text-center text-[14px]">{% csrf_token %}<button type="submit" class="font-semibold text-brand-navy underline-offset-4 hover:underline">Send a new code</button></form>
{% endblock %}
